spring:
  application:
    name: trader

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://keycloak:8087/auth/realms/demo}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://keycloak:8087/auth/realms/demo/protocol/openid-connect/certs}


  ai:
    mcp:
      client:
        enabled: true
        streamable-http:
          connections:
            financial-server:
              url: "http://localhost:8081"

embabel:
  agent:
    platform:
      models:
        openai:
          api-key: ${OPENAI_API_KEY}
    logging:
      personality: starwars
  models:
    default-llm: claude-sonnet-4-6
    llms:
      reviewer: claude-opus-4-6