plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.agilesolutions'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenLocal()
	mavenCentral()
	maven { url = 'https://repo.spring.io/milestone' }
	maven { url = 'https://repo.spring.io/snapshot' }
	maven { url = uri("https://repo.embabel.com/artifactory/libs-snapshot") }
}
ext {
	set('springAiVersion', "2.0.0-RC1")
}

dependencies {
	implementation project(':trader-common')

	// Bill of Materials
	implementation platform("org.springframework.ai:spring-ai-bom:2.0.0-RC1")
	//implementation platform("io.modelcontextprotocol.sdk:mcp-bom:0.8.1")
	//implementation platform("com.embabel.agent:embabel-agent-experimental-bom:0.3.5-SNAPSHOT")

	// Core and MCP Client dependencies
	implementation 'com.embabel.agent:embabel-agent-starter:2.0.0-SNAPSHOT'
	implementation 'com.embabel.agent:embabel-agent-starter-shell:2.0.0-SNAPSHOT'
	implementation 'com.embabel.agent:embabel-agent-starter-openai:2.0.0-SNAPSHOT'

	implementation 'org.springframework.ai:spring-ai-starter-mcp-client-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.retry:spring-retry:2.0.6'
	// Oauth2 Resource Server for JWT validation
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

	// Choose one LLM provider
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	// OR
	// implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	// OR
	// implementation 'org.springframework.ai:spring-ai-starter-model-azure-openai'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// swagger ui for testing
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9")
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.9")

	// Test dependencies (required to use Lombok in src/test/java)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers:1.19.3'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Embabel agent testing dependencies
	testImplementation 'com.embabel.agent:embabel-agent-test:2.0.0-SNAPSHOT'
	testImplementation 'com.embabel.agent:embabel-agent-test-common:2.0.0-SNAPSHOT'
	//testImplementation 'com.embabel.agent:embabel-agent-test-domain:0.3.1'
	testImplementation 'com.embabel.agent:embabel-agent-test-internal:2.0.0-SNAPSHOT'
	testImplementation 'com.embabel.agent:embabel-agent-test-support:2.0.0-SNAPSHOT'
    testImplementation 'com.embabel.agent:embabel-agent-starter:2.0.0-SNAPSHOT'
    testImplementation 'com.embabel.agent:embabel-agent-platform-autoconfigure:2.0.0-SNAPSHOT'



	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
